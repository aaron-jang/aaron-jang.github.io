# 수수라이프 — Jekyll Chirpy 테마 설정
# 테마 문서: https://github.com/cotes2020/jekyll-theme-chirpy/wiki

theme: jekyll-theme-chirpy

lang: ko-KR
timezone: Asia/Seoul

# ---------- 사이트 정보 ----------
title: 수수라이프
tagline: 수수의 일상기록
description: >-
  IT/테크, 재테크, 생활 정보를 다루는 한국어 블로그. 복잡한 정보를 누구나 이해할 수 있도록 쉽고 명확하게 정리합니다.
url: "https://soosoo.life"
baseurl: ""

github:
  username: aaron-jang

social:
  name: 수수
  email: soosoolife.k@gmail.com
  links:
    - https://soosoo.life/about/

# ---------- 분석 / 광고 ----------
analytics:
  google:
    id: G-FVWYZ3MFW9

# Beautiful Jekyll 시절부터 쓰던 자체 설정 (_includes/metadata-hook.html 에서 사용)
naver-analytics: "187319d03136db0"
adsense-client: "ca-pub-8723414546149679"

pageviews:
  provider:

# ---------- 외관 ----------
theme_mode: # light | dark — 비우면 시스템 설정을 따름
cdn:
avatar: /assets/img/avatar-icon.webp
social_preview_image:
toc: true

actions:
  edit_post:
    enabled: false

# ---------- 댓글 ----------
comments:
  provider: giscus
  giscus:
    repo: aaron-jang/aaron-jang.github.io
    repo_id: R_kgDOQpIR0A
    category: Announcements
    category_id: DIC_kwDOQpIR0M4C0-Hd
    mapping: title
    strict: 0
    input_position: bottom
    lang: ko
    reactions_enabled: 1

assets:
  self_host:
    enabled:
    env:

pwa:
  enabled: true
  cache:
    enabled: true
    deny_paths:

paginate: 10

# ---------- 빌드 ----------
markdown: kramdown
kramdown:
  input: GFM
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      # 기존 URL 유지 (Beautiful Jekyll 시절과 동일)
      permalink: /:year-:month-:day-:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - scripts
  - README.md
  - LICENSE
  - CNAME
  - Gemfile
  - Gemfile.lock
  - cleanup_files.txt
  - fix_image_paths.py
  - fix_markdown_images.py
  - fix_old_image_paths.py
  - favicon_origin.png
  - purgecss.js
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
