name: Naver IndexNow

on:
  # 수동 실행은 Action 호환성 점검용이며 색인 요청을 보내지 않습니다.
  workflow_dispatch:
  # Pages 배포 성공 후에만 상위 워크플로에서 호출합니다.
  workflow_call:

permissions:
  contents: read

jobs:
  indexnow:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 변경된 포스트 파일 감지
        if: github.event_name == 'push'
        id: changed
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # 푸시 전체를 비교하고, 신규 브랜치는 빈 트리와 비교합니다.
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git -c core.quotePath=false diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '_posts/*.md' > /tmp/changed_posts.txt
          if [ -s /tmp/changed_posts.txt ]; then
            echo "has_posts=true" >> "$GITHUB_OUTPUT"
            echo "변경된 포스트:"
            cat /tmp/changed_posts.txt
          else
            echo "has_posts=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 세팅
        if: github.event_name == 'workflow_dispatch' || steps.changed.outputs.has_posts == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: 네이버 IndexNow 색인 요청
        if: steps.changed.outputs.has_posts == 'true'
        run: |
          python3 scripts/naver-indexnow.py --file /tmp/changed_posts.txt
