{% if page.layout == 'post' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": {{ site.title | jsonify }},
      "item": "{{ site.url }}"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": {{ page.categories[0] | default: 'Posts' | jsonify }},
      "item": "{{ site.url }}/categories{% if page.categories[0] %}#{{ page.categories[0] }}{% endif %}"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": {{ page.title | jsonify }},
      "item": "{{ page.url | absolute_url }}"
    }
  ]
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BlogPosting",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "headline": {{ page.title | jsonify }},
  "description": {% if page.subtitle %}{{ page.subtitle | jsonify }}{% else %}{{ page.content | strip_html | truncatewords: 50 | jsonify }}{% endif %},
  {% if page.cover-img %}"image": "{{ page.cover-img | absolute_url }}",{% elsif page.thumbnail-img %}"image": "{{ page.thumbnail-img | absolute_url }}",{% endif %}
  "datePublished": "{{ page.date | date_to_xmlschema }}",
  "dateModified": "{{ page.last-updated | default: page.date | date_to_xmlschema }}",
  "author": {
    "@type": "Person",
    "name": {{ page.author | default: site.author | jsonify }},
    "url": "{{ site.url }}/about/"
  },
  "publisher": {
    "@type": "Organization",
    "name": {{ site.title | jsonify }},
    "logo": {
      "@type": "ImageObject",
      "url": "{{ site.avatar | absolute_url }}"
    }
  },
  "speakable": {
    "@type": "SpeakableSpecification",
    "cssSelector": [".blog-post h2", ".blog-post p:first-of-type", ".blog-post blockquote"]
  },
  "isAccessibleForFree": true{% if page.tags.size > 0 %},
  "keywords": {{ page.tags | join: ', ' | jsonify }}{% endif %}
}
</script>
{% endif %}

{% if page.layout == 'home' or page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "name": {{ site.title | jsonify }},
  "url": "{{ site.url }}",
  "description": {{ site.rss-description | jsonify }},
  "inLanguage": "ko",
  "author": {
    "@type": "Person",
    "name": {{ site.author | jsonify }}
  },
  "potentialAction": {
    "@type": "SearchAction",
    "target": "{{ site.url }}/?q={search_term_string}",
    "query-input": "required name=search_term_string"
  },
  "publisher": { "@id": "{{ site.url }}/#organization" }
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Organization",
  "@id": "{{ site.url }}/#organization",
  "name": {{ site.title | jsonify }},
  "alternateName": {{ site.url-pretty | default: site.title | jsonify }},
  "url": "{{ site.url }}",
  "description": {{ site.rss-description | jsonify }},
  "logo": {
    "@type": "ImageObject",
    "url": "{{ site.avatar | absolute_url }}"
  },
  "founder": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "url": "{{ site.url }}/about/"
  },
  "inLanguage": "ko"{% if site.social-network-links.email %},
  "email": "{{ site.social-network-links.email }}"{% endif %}
}
</script>
{% endif %}

{% if page.layout == 'page' and page.url contains 'about' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": "{{ page.url | absolute_url }}"
  },
  "mainEntity": {
    "@type": "Person",
    "name": {{ site.author | jsonify }},
    "alternateName": {{ site.title | jsonify }},
    "description": {{ page.subtitle | default: site.rss-description | jsonify }},
    "url": "{{ page.url | absolute_url }}",
    "image": "{{ site.avatar | absolute_url }}",
    "jobTitle": "Blogger",
    "knowsAbout": ["IT", "Technology", "Finance", "Lifestyle"],
    "knowsLanguage": ["ko", "en"]
  }
}
</script>
{% endif %}

{% if page.is-series-pillar and page.series-posts %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ItemList",
  "name": {{ page.title | jsonify }},
  "description": {{ page.subtitle | default: '' | jsonify }},
  "numberOfItems": {{ page.series-posts.size }},
  "itemListElement": [
    {% for post in page.series-posts %}
    {
      "@type": "ListItem",
      "position": {{ forloop.index }},
      "name": {{ post.title | jsonify }},
      "url": "{{ post.url | absolute_url }}"
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
